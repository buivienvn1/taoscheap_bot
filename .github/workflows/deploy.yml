name: Deploy to cPanel

on:
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql, curl, json, mbstring
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Trigger native cPanel deployment
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        run: |
          response=$(curl --fail-with-body --silent --show-error \
            --get "https://${CPANEL_HOST}:${CPANEL_PORT:-2083}/execute/VersionControlDeployment/create" \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}")
          echo "$response"
          echo "$response" | php -r '
            $result = json_decode(stream_get_contents(STDIN), true);
            if (($result["status"] ?? 0) !== 1) {
                fwrite(STDERR, "cPanel deployment request failed.\n");
                exit(1);
            }
          '
