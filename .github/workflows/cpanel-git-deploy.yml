name: Auto Deploy via cPanel Git

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-git-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CPANEL_PORT: '2083'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_API_TOKEN CPANEL_REPOSITORY_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Create and run cPanel deployment task
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          host="${CPANEL_HOST#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          host="${host%%:*}"

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}" \
            "https://${host}:${CPANEL_PORT}/execute/VersionControlDeployment/create")"

          echo "Deployment HTTP status: ${http_code}"
          echo "Deployment API response:"
          jq '.' "$response_file" || cat "$response_file"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ] || \
             [ "$(jq -r '.status // 0' "$response_file")" != "1" ]; then
            echo "::error::cPanel rejected the deployment request."
            exit 1
          fi

          task_id="$(jq -r '.data.task_id // empty' "$response_file")"
          log_path="$(jq -r '.data.log_path // empty' "$response_file")"
          if [ -z "$task_id" ]; then
            echo "::error::Deployment response did not contain task_id."
            exit 1
          fi

          # The sse_url returned by this API requires a browser session and responds
          # with HTTP 403 to API-token authentication. Do not treat that endpoint as
          # a task monitor; the public commit marker below is the deployment contract.
          echo "cPanel accepted deployment task ${task_id}."
          if [ -n "$log_path" ]; then
            echo "cPanel task log: ${log_path}"
          fi

      - name: Verify deployed commit on production
        env:
          DEPLOY_MARKER_URL: https://taoscheap.qthang.net/deploy-commit.txt
        shell: bash
        run: |
          set -euo pipefail
          max_attempts=60
          delay_seconds=10
          last_http_code=""
          for attempt in $(seq 1 "$max_attempts"); do
            marker_file="$(mktemp)"
            last_http_code="$(curl --silent --show-error \
              --output "$marker_file" \
              --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store' \
              "${DEPLOY_MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            deployed_sha="$(tr -d '\r\n[:space:]' < "$marker_file")"
            rm -f "$marker_file"

            echo "Verification ${attempt}/${max_attempts}: HTTP ${last_http_code:-000}, expected=${GITHUB_SHA}, deployed=${deployed_sha:-not available}"
            if [ "$last_http_code" = "200" ] && [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Production deployment verified successfully."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$delay_seconds"
            fi
          done

          echo "::error::Production did not expose commit ${GITHUB_SHA} within $((max_attempts * delay_seconds)) seconds (last HTTP status: ${last_http_code:-000}). Check the cPanel deployment task log."
          exit 1
