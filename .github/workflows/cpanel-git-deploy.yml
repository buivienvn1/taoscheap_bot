name: Auto Deploy via cPanel Git

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-git-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CPANEL_PORT: '2083'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_API_TOKEN CPANEL_REPOSITORY_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Create and run cPanel deployment task
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          host="${CPANEL_HOST#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          host="${host%%:*}"

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}" \
            "https://${host}:${CPANEL_PORT}/execute/VersionControlDeployment/create")"

          echo "Deployment HTTP status: ${http_code}"
          echo "Deployment API response:"
          jq '.' "$response_file" || cat "$response_file"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ] || \
             [ "$(jq -r '.status // 0' "$response_file")" != "1" ]; then
            echo "::error::cPanel rejected the deployment request."
            exit 1
          fi

          task_id="$(jq -r '.data.task_id // empty' "$response_file")"
          log_path="$(jq -r '.data.log_path // empty' "$response_file")"
          if [ -z "$task_id" ]; then
            echo "::error::Deployment response did not contain task_id."
            exit 1
          fi

          # The sse_url returned by this API requires a browser session and responds
          # with HTTP 403 to API-token authentication. Do not treat that endpoint as
          # a task monitor; the public commit marker below is the deployment contract.
          echo "cPanel accepted deployment task ${task_id}."
          if [ -n "$log_path" ]; then
            echo "cPanel task log: ${log_path}"
          fi

      - name: Verify code sync on production
        env:
          CODE_MARKER_URL: https://taoscheap.qthang.net/deploy-code-commit.txt
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            deployed_sha="$(curl --silent --show-error --fail \
              --header 'Cache-Control: no-cache, no-store' \
              "${CODE_MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null \
              | tr -d '\r\n[:space:]' || true)"
            echo "Code sync ${attempt}/12: expected=${GITHUB_SHA}, deployed=${deployed_sha:-not available}"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Production code sync verified successfully."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Production code was not synchronized to commit ${GITHUB_SHA}. Check the cPanel deployment task log."
          exit 1

      - name: Verify database migration on production
        env:
          MIGRATION_MARKER_URL: https://taoscheap.qthang.net/deploy-migration-status.txt
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            migration_status="$(curl --silent --show-error --fail \
              --header 'Cache-Control: no-cache, no-store' \
              "${MIGRATION_MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null \
              | tr -d '\r' | xargs || true)"
            echo "Migration ${attempt}/12: expected=${GITHUB_SHA} success, actual=${migration_status:-not available}"
            if [ "$migration_status" = "${GITHUB_SHA} success" ]; then
              echo "Production database migration verified successfully."
              exit 0
            fi
            if [ "$migration_status" = "${GITHUB_SHA} failed" ]; then
              echo "::error::Production code is synchronized, but database migration failed for commit ${GITHUB_SHA}. Check the cPanel deployment task log."
              exit 1
            fi
            sleep 5
          done

          echo "::error::Production code may be synchronized, but migration status for commit ${GITHUB_SHA} is unavailable. Check the cPanel deployment task log."
          exit 1
