name: Auto Deploy via cPanel Git

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cpanel-git-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CPANEL_PORT: '2083'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_API_TOKEN CPANEL_REPOSITORY_ROOT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              exit 1
            fi
          done

      - name: Create and run cPanel deployment task
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          host="${CPANEL_HOST#https://}"
          host="${host#http://}"
          host="${host%%/*}"
          host="${host%%:*}"

          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get \
            --data-urlencode "repository_root=${CPANEL_REPOSITORY_ROOT}" \
            "https://${host}:${CPANEL_PORT}/execute/VersionControlDeployment/create")"

          echo "Deployment HTTP status: ${http_code}"
          echo "Deployment API response:"
          jq '.' "$response_file" || cat "$response_file"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ] || \
             [ "$(jq -r '.status // 0' "$response_file")" != "1" ]; then
            echo "::error::cPanel rejected the deployment request."
            exit 1
          fi

          sse_url="$(jq -r '.data.sse_url // empty' "$response_file")"
          task_id="$(jq -r '.data.task_id // empty' "$response_file")"
          if [ -z "$sse_url" ] || [ -z "$task_id" ]; then
            echo "::error::Deployment response did not contain sse_url/task_id."
            exit 1
          fi

          echo "Running cPanel task ${task_id} through ${sse_url}"
          sse_log="$(mktemp)"
          curl --silent --show-error --no-buffer \
            --max-time 180 \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            "https://${host}:${CPANEL_PORT}${sse_url}" \
            | tee "$sse_log" || true

          echo "cPanel task stream ended."
          if grep -Eqi '(^|[^a-z])(error|failed|failure)([^a-z]|$)' "$sse_log"; then
            echo "::error::The cPanel deployment task reported an error."
            exit 1
          fi

      - name: Verify deployed commit on production
        env:
          DEPLOY_MARKER_URL: https://taoscheap.qthang.net/deploy-commit.txt
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            deployed_sha="$(curl --silent --show-error --fail \
              --header 'Cache-Control: no-cache' \
              "${DEPLOY_MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${attempt}" 2>/dev/null \
              | tr -d '\r\n[:space:]' || true)"

            echo "Verification ${attempt}/12: expected=${GITHUB_SHA}, deployed=${deployed_sha:-not available}"
            if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
              echo "Production deployment verified successfully."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Production does not contain commit ${GITHUB_SHA}."
          exit 1
